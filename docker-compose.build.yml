# Local build override for testing the current checkout instead of the published image.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# This runs the full frontend → binary → scratch image pipeline and can take minutes
# on a single-core machine, so deployment hosts use the published image by default.
services:
  quotapulse:
    build:
      context: .
      args:
        # Mark local builds as local so /health distinguishes them from releases.
        VERSION: local
    image: quotapulse:local
    pull_policy: build
