# Prometheus + Grafana，按需叠加在核心服务之上：
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# 为什么单独一个文件而不是用 profiles：compose 会先把整个文件插值一遍再判断 profile，
# 下面的 GRAFANA_ADMIN_PASSWORD:? 会连带把只跑核心服务的命令一起卡住。
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: balance-alert-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitor-network
    depends_on:
      - balance-alert

  grafana:
    image: grafana/grafana:latest
    container_name: balance-alert-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # 不给默认口令：面板能看到所有账户余额，密码必须显式设
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?请在 .env 里设置 GRAFANA_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/balance-alert-dashboard.json
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - monitor-network
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
