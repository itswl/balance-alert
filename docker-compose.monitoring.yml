# Prometheus + Grafana, layered on top of the core service when needed:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# This is a separate file because Compose interpolates the whole file before evaluating
# profiles; the required Grafana password would otherwise block core-only commands.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: quotapulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitor-network
    depends_on:
      - quotapulse

  grafana:
    image: grafana/grafana:latest
    container_name: quotapulse-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # No default password: Grafana can display every account balance.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/quotapulse-dashboard.json
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - monitor-network
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
