services:
  balance-alert:
    build: .
    image: balance-alert:latest
    container_name: balance-alert
    restart: unless-stopped
    ports:
      - "8080:8080"  # Web 看板与 API
      - "9100:9100"  # Prometheus 指标
    volumes:
      - ./data:/app/data   # 数据库持久化
      - ./logs:/app/logs   # 设了 LOG_FILE 才会用到
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    # 一个进程里跑 Web、定时任务和指标，容器里没有 cron
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge
