# Pull the published image by default; do not build on the deployment host.
#
#   docker compose up -d
#
# To build the current checkout, add the build override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Add Prometheus and Grafana:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d

services:
  quotapulse:
    # Defaults to latest. Pin QUOTAPULSE_VERSION in production so a pull cannot
    # silently replace the running version.
    image: ghcr.io/itswl/quotapulse:${QUOTAPULSE_VERSION:-latest}
    container_name: quotapulse
    restart: unless-stopped
    pull_policy: missing
    ports:
      - "8080:8080"  # Web dashboard and API
      - "9100:9100"  # Prometheus metrics
    volumes:
      - ./data:/app/data   # Persistent database storage, including SQLite files
      - ./logs:/app/logs   # Used only when LOG_FILE is set
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    # Web, scheduled jobs, and metrics run in one process; the container has no cron.
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge
