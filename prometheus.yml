# Prometheus configuration
global:
  scrape_interval: 60s  # Scrape every 60 seconds
  evaluation_interval: 60s  # Evaluate rules every 60 seconds
  scrape_timeout: 10s

scrape_configs:
  # Balance monitoring service
  - job_name: 'quotapulse'
    static_configs:
      - targets: ['quotapulse:9100']  # Docker Compose service and metrics port
        labels:
          service: 'quotapulse'
          environment: 'production'
    
    # For a local deployment, use:
    # - targets: ['localhost:9100']
