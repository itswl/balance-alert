version: "2"

# Generate one package per database engine. Differences are limited to SQL syntax
# (placeholders, upserts, and identifier quoting); Go row and parameter structs keep
# the same layout so internal/store can adapt all three packages to one Store interface.
#
# These overrides pin PostgreSQL/MySQL INTEGER columns to NullInt64. sqlc defaults to
# NullInt32 for those engines while SQLite uses NullInt64, which would break the layout.
sql:
  - engine: "sqlite"
    schema: "internal/store/schema/sqlite.sql"
    queries: "internal/store/queries/sqlite.sql"
    gen:
      go:
        package: "sqlite"
        out: "internal/store/sqlc/sqlite"
        emit_empty_slices: true

  - engine: "postgresql"
    schema: "internal/store/schema/postgres.sql"
    queries: "internal/store/queries/postgres.sql"
    gen:
      go:
        package: "postgres"
        out: "internal/store/sqlc/postgres"
        emit_empty_slices: true
        overrides: &int64_columns
          - column: "email_config.port"
            nullable: true
            go_type: "database/sql.NullInt64"
          - column: "subscription_config.renewal_day"
            nullable: true
            go_type: "database/sql.NullInt64"
          - column: "subscription_config.alert_days_before"
            nullable: true
            go_type: "database/sql.NullInt64"

  - engine: "mysql"
    schema: "internal/store/schema/mysql.sql"
    queries: "internal/store/queries/mysql.sql"
    gen:
      go:
        package: "mysql"
        out: "internal/store/sqlc/mysql"
        emit_empty_slices: true
        overrides: *int64_columns
