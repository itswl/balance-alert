version: "2"

# 三种引擎各生成一个包。差异只在 SQL 文本（占位符、upsert 写法、标识符引号），
# Go 侧的行与参数结构体刻意保持完全一致的字段布局，internal/store 才能用结构体转换
# 把三个包适配到同一个 Store 接口上，而不必逐字段搬运。
#
# overrides 把 postgres/mysql 的 INTEGER 列钉成 NullInt64：sqlc 默认给它们 NullInt32，
# 而 sqlite 给 NullInt64，不统一就破坏了上面那条「布局一致」的前提。
# 列本身仍声明为 INTEGER，与 SQLAlchemy 建出来的现有生产库一致。
sql:
  - engine: "sqlite"
    schema: "internal/store/schema/sqlite.sql"
    queries: "internal/store/queries/sqlite.sql"
    gen:
      go:
        package: "sqlite"
        out: "internal/store/sqlc/sqlite"
        emit_empty_slices: true

  - engine: "postgresql"
    schema: "internal/store/schema/postgres.sql"
    queries: "internal/store/queries/postgres.sql"
    gen:
      go:
        package: "postgres"
        out: "internal/store/sqlc/postgres"
        emit_empty_slices: true
        overrides: &int64_columns
          - column: "email_config.port"
            nullable: true
            go_type: "database/sql.NullInt64"
          - column: "subscription_config.renewal_day"
            nullable: true
            go_type: "database/sql.NullInt64"
          - column: "subscription_config.alert_days_before"
            nullable: true
            go_type: "database/sql.NullInt64"

  - engine: "mysql"
    schema: "internal/store/schema/mysql.sql"
    queries: "internal/store/queries/mysql.sql"
    gen:
      go:
        package: "mysql"
        out: "internal/store/sqlc/mysql"
        emit_empty_slices: true
        overrides: *int64_columns
